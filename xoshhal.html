<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>xoshhal — تماس</title>

<style>
@font-face{font-family:'Vazirmatn';src:url('assets/fonts/Vazirmatn-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Vazirmatn';src:url('assets/fonts/Vazirmatn-SemiBold.ttf') format('truetype');font-weight:600;font-display:swap}
@font-face{font-family:'Vazirmatn';src:url('assets/fonts/Vazirmatn-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
@font-face{font-family:'Darvish';src:url('assets/fonts/darvish/Darvish%20%5B@FontiranIR%5D/Darvish-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#050505;color:#e8e2dc;
  font-family:'Vazirmatn',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:24px;overflow-x:hidden;
  background-image:radial-gradient(ellipse 120% 90% at 50% -10%,rgba(255,106,42,.07),transparent 55%);
}
.frame{position:fixed;inset:14px;border:1px solid rgba(255,255,255,.09);border-radius:14px;pointer-events:none}
.card{width:min(400px,100%);position:relative;z-index:1}
.mark{
  font-family:'Darvish','Vazirmatn',sans-serif;font-weight:700;
  font-size:clamp(40px,11vw,56px);line-height:1;color:#ff6a2a;
  text-align:center;margin-bottom:34px;direction:ltr;
}
.mark::after{content:'';display:block;width:44px;height:2px;background:#ff6a2a;margin:18px auto 0;opacity:.55}
.rows{display:flex;flex-direction:column;gap:12px}
.row{
  display:grid;grid-template-columns:38px 84px 1fr auto;
  align-items:center;gap:0 13px;
  padding:15px 16px;border-radius:14px;
  background:linear-gradient(165deg,rgba(18,14,11,.9),rgba(9,9,9,.82));
  border:1px solid rgba(255,255,255,.12);
  text-decoration:none;color:inherit;
  transition:border-color .25s ease,transform .2s ease,box-shadow .25s ease;
}
.row:hover,.row:focus-visible{border-color:rgba(255,106,42,.65);transform:translateY(-2px);box-shadow:0 14px 40px rgba(0,0,0,.5)}
.row .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:rgba(255,106,42,.09);border:1px solid rgba(255,106,42,.28)}
.row .ic svg{width:18px;height:18px;stroke:#ff8a3c;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.row .lbl{font-size:10.5px;letter-spacing:.04em;color:rgba(255,255,255,.42);text-align:right;white-space:nowrap}
.row .val{font-size:13px;font-weight:600;color:#ffd9c2;direction:ltr;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .act{font-size:10px;color:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 11px;background:none;cursor:default;font-family:inherit;transition:color .25s ease,border-color .25s ease;white-space:nowrap}
button.act{cursor:pointer}
button.act:hover,button.act:focus-visible{color:#ff8a3c;border-color:rgba(255,106,42,.5)}
.foot{margin-top:30px;display:flex;justify-content:space-between;align-items:center;font-size:9px;letter-spacing:.14em;color:rgba(255,255,255,.26);direction:ltr}
.foot a{color:rgba(255,255,255,.4);text-decoration:none;border-bottom:1px solid rgba(255,106,42,.35);padding-bottom:2px;transition:color .25s ease,border-color .25s ease;direction:rtl;font-family:'Vazirmatn',sans-serif}
.foot a:hover,.foot a:focus-visible{color:#ff6a2a;border-color:#ff6a2a}
.toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(14px);
  background:#160c06;color:#ffb17f;border:1px solid rgba(255,106,42,.45);
  font-size:11px;padding:9px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:420px){
  .frame{inset:10px;border-radius:12px}
  .row{grid-template-columns:38px 70px 1fr;padding:14px 13px;gap:0 10px}
  .row .lbl{font-size:10px}
  .row .val{font-size:11.5px}
  .row .act{display:none}
}
</style>
</head>
<body>
<div class="frame" aria-hidden="true"></div>
<main class="card">
  <h1 class="mark">xoshhal</h1>
  <div class="rows">
    <a class="row" href="mailto:es.khoshhal@gmail.com">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/></svg></span>
      <span class="lbl">ایمیل</span>
      <span class="val">es.khoshhal@gmail.com</span>
      <button class="act" type="button" data-copy="es.khoshhal@gmail.com">کپی</button>
    </a>
    <a class="row" href="https://wa.me/989112300389" target="_blank" rel="noopener">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 21l2.1-5.4A8.5 8.5 0 1 1 21 11.5Z"/><path d="M8.8 9.2c.3 2.6 3.4 5.7 6 6l1.5-1.5-2-1.3-1 .7c-.8-.4-1.7-1.3-2.1-2.1l.7-1-1.3-2-1.8 1.2Z"/></svg></span>
      <span class="lbl">واتس‌اپ</span>
      <span class="val">+98 911 230 0389</span>
      <span class="act">چت</span>
    </a>
    <a class="row" href="tel:+989112300389">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 4h4l1.5 4.5L8 10a12 12 0 0 0 6 6l1.5-2.5L20 15v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg></span>
      <span class="lbl">تماس</span>
      <span class="val">+98 911 230 0389</span>
      <span class="act">تماس</span>
    </a>
  </div>
  <div class="foot"><span>© 2026 XOSHHAL</span><a href="index.html">بازگشت به سایت</a></div>
</main>
<div class="toast" id="toast" role="status">کپی شد ✓</div>
<script>
(function(){
  var t=document.getElementById('toast'),tm;
  document.querySelectorAll('[data-copy]').forEach(function(b){
    b.addEventListener('click',function(e){
      e.preventDefault();e.stopPropagation();
      var v=b.getAttribute('data-copy');
      function ok(){t.classList.add('show');clearTimeout(tm);tm=setTimeout(function(){t.classList.remove('show')},1600)}
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(v).then(ok,ok)}
      else{var i=document.createElement('input');i.value=v;document.body.appendChild(i);i.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(i);ok()}
    });
  });
})();
</script>
</body>
</html>
