<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سینا گل‌نقره — Color Reveal (نمونه)</title>
<style>
@font-face{font-family:'Vazirmatn';src:url('assets/fonts/Vazirmatn-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Vazirmatn';src:url('assets/fonts/Vazirmatn-Medium.ttf') format('truetype');font-weight:500;font-display:swap}
@font-face{font-family:'Vazirmatn';src:url('assets/fonts/Vazirmatn-SemiBold.ttf') format('truetype');font-weight:600;font-display:swap}
@font-face{font-family:'Vazirmatn';src:url('assets/fonts/Vazirmatn-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
@font-face{font-family:'Lalezar';src:url('assets/fonts/Lalezar-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:#000;color:#fff;
  font-family:'Vazirmatn',system-ui,sans-serif;
  height:100vh;overflow:hidden;   /* journey is button-driven — no scroll */
}
::selection{background:rgba(255,120,50,.35)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#050505}
::-webkit-scrollbar-thumb{background:linear-gradient(#ff7a2f,#ff3c00);border-radius:99px}

/* ====== sticky stage ====== */
.stage{
  position:sticky;top:0;height:100vh;width:100%;
  overflow:hidden;background:#000;
}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ====== HUD ====== */
.hud{position:absolute;inset:0;pointer-events:none;z-index:5}
.badge{
  position:absolute;top:22px;right:26px;
  display:flex;align-items:center;gap:9px;
  font-size:11px;letter-spacing:.14em;color:rgba(255,255,255,.55);
  border:1px solid rgba(255,255,255,.12);border-radius:99px;
  padding:7px 14px;background:rgba(255,255,255,.04);backdrop-filter:blur(8px);
}
.badge .dot{width:7px;height:7px;border-radius:50%;background:#ff5a1f;box-shadow:0 0 10px #ff5a1f;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.counter{
  position:absolute;top:20px;left:26px;text-align:left;
  font-variant-numeric:tabular-nums;line-height:1.15;
}
.counter .num{font-size:30px;font-weight:700;letter-spacing:-.02em}
.counter .num small{font-size:14px;font-weight:400;color:rgba(255,255,255,.4);margin-left:2px}
.counter .lbl{font-size:9px;letter-spacing:.28em;color:rgba(255,255,255,.35);margin-top:4px}
.meters{display:flex;gap:10px;margin-top:10px}
.meter{width:52px}
.meter .bar{height:2px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.meter .bar i{display:block;height:100%;width:0%;border-radius:99px;transition:width .12s linear}
.meter.b1 .bar i{background:rgba(255,255,255,.65)}
.meter.b2 .bar i{background:rgba(255,255,255,.9)}
.meter.b3 .bar i{background:linear-gradient(90deg,#ff8a3c,#ff3c00)}
.meter .cap{font-size:8px;letter-spacing:.2em;color:rgba(255,255,255,.3);margin-top:4px;text-align:left}

.phases{
  position:absolute;bottom:26px;right:26px;display:flex;gap:8px;
}
.phase{
  font-size:11px;padding:7px 14px;border-radius:99px;
  border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.35);
  background:rgba(255,255,255,.03);backdrop-filter:blur(8px);
  transition:all .35s ease;
}
.phase.active{
  color:#000;background:#fff;border-color:#fff;font-weight:600;
  box-shadow:0 0 24px rgba(255,255,255,.25);
}
.phase.p3.active{background:#ff4d12;border-color:#ff4d12;box-shadow:0 0 28px rgba(255,77,18,.5)}

/* ====== entry button ====== */
.enterwrap{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  z-index:6;pointer-events:none;
}
.enterbtn{
  pointer-events:auto;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  background:none;border:0;color:#fff;font-family:inherit;
  opacity:0;transform:translateY(16px);
  transition:opacity .9s ease,transform .9s ease;
}
.enterbtn.ready{opacity:1;transform:none}
.enterbtn.gone{opacity:0!important;transform:translateY(-12px);pointer-events:none;transition:opacity .7s ease,transform .7s ease}
.enterbtn .ring{
  width:112px;height:112px;border-radius:50%;position:relative;
  border:1px solid rgba(255,122,47,.45);
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,90,31,.05);backdrop-filter:blur(6px);
  transition:border-color .3s ease,background .3s ease,box-shadow .3s ease;
}
.enterbtn .ring::before{
  content:'';position:absolute;inset:-1px;border-radius:50%;
  border:1px solid rgba(255,122,47,.55);
  animation:enterpulse 2.6s ease-out infinite;
}
@keyframes enterpulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.55);opacity:0}}
.enterbtn .word{font-family:'Lalezar',Vazirmatn,sans-serif;font-size:26px;font-weight:400;line-height:1;color:#ffd9c2}
.enterbtn .cap{font-size:9px;letter-spacing:.42em;color:rgba(255,255,255,.38);direction:ltr}
.enterbtn:hover .ring{border-color:rgba(255,122,47,.9);background:rgba(255,90,31,.14);box-shadow:0 0 42px rgba(255,77,18,.35)}

.frame{
  position:absolute;inset:16px;border:1px solid rgba(255,255,255,.06);
  border-radius:22px;pointer-events:none;z-index:4;
}
.vignette{
  position:absolute;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(130% 90% at 50% 42%,transparent 42%,rgba(0,0,0,.55) 100%);
}

/* ====== fixed stage (no scroll track — journey is button-driven) ====== */

@media(max-width:820px){
  .badge{top:14px;right:14px;font-size:10px;padding:6px 11px}
  .counter{top:12px;left:14px}
  .counter .num{font-size:24px}
  .phases{bottom:18px;right:14px;gap:6px}
  .phase{font-size:10px;padding:6px 10px}
  .frame{inset:10px;border-radius:16px}
  .enterbtn .ring{width:96px;height:96px}
}
@media(prefers-reduced-motion:reduce){
  .enterbtn .ring::before{animation:none}
  .badge .dot{animation:none}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<!-- ============ STAGE (sticky canvas) ============ -->
<div class="stage" id="stage">
  <canvas id="gl"></canvas>


  <div class="vignette"></div>
  <div class="frame"></div>

  <div class="hud">
    <div class="badge"><span class="dot"></span>BLUR → FOCUS → COLOR&nbsp;&nbsp;·&nbsp;&nbsp;شیدر WebGL2 خام</div>

    <div class="counter">
      <div class="num"><span id="pct">0</span><small>%</small></div>
      <div class="lbl">PROGRESS</div>
      <div class="meters">
        <div class="meter b1"><div class="bar"><i id="mb1"></i></div><div class="cap">BLUR</div></div>
        <div class="meter b2"><div class="bar"><i id="mb2"></i></div><div class="cap">FOCUS</div></div>
        <div class="meter b3"><div class="bar"><i id="mb3"></i></div><div class="cap">COLOR</div></div>
      </div>
    </div>

    <div class="phases">
      <div class="phase p1" id="ph1">۱ · محو</div>
      <div class="phase p2" id="ph2">۲ · فوکوس</div>
      <div class="phase p3" id="ph3">۳ · رنگ</div>
    </div>

    <div class="enterwrap">
      <button class="enterbtn" id="enterbtn" type="button">
        <span class="ring"><span class="word">ورود</span></span>
        <span class="cap">COLOR · REVEAL</span>
      </button>
    </div>
  </div>
</div>

<script>
/* ================================================================
   Color-Reveal — raw WebGL2, no libraries.
   Phases (scroll-driven):
     1. blur 15→2, B&W, low contrast        (p 0 → .38)
     2. blur 2→0, B&W, contrast .75→1.1     (p .38 → .62)
     3. color sweeps from geometric logo,
        soft-edged, not global               (p .62 → 1)
   Image occupies the RIGHT third, fades to black leftward,
   text appears on the black zone in phase 3.
================================================================ */
(function(){
'use strict';

var canvas = document.getElementById('gl');
var gl = canvas.getContext('webgl2', {alpha:false, antialias:true, powerPreference:'high-performance', preserveDrawingBuffer:true});
if(!gl){
  document.body.insertAdjacentHTML('afterbegin',
    '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#888;font-family:sans-serif;z-index:99">WebGL2 پشتیبانی نمی‌شود</div>');
  return;
}

/* ---------- shaders ---------- */
var VS = `#version 300 es
precision highp float;
in vec2 aPos;
out vec2 vUv;
void main(){
  vUv = aPos * .5 + .5;
  vUv.y = 1. - vUv.y;
  gl_Position = vec4(aPos, 0., 1.);
}`;

var FS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 outColor;

uniform sampler2D uTexB;   // background plate
uniform sampler2D uTexF;   // subject plate (alpha = cutout)
uniform vec2  uMouse;      // smoothed pointer -1..1 (parallax)
uniform float uDepth;      // parallax intensity 0..1
uniform vec2  uRes;        // canvas px
uniform vec2  uImgRes;     // image px
uniform float uBlur;       // 0..15
uniform float uContrast;   // .75..1.1
uniform float uReveal;     // 0..1   color phase
uniform float uTextIn;     // 0..1   text fade-in
uniform float uTime;

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }

vec3 sampB(vec2 uv){
  if(uv.x<0.||uv.x>1.||uv.y<0.||uv.y>1.) return vec3(0.);
  return texture(uTexB, uv).rgb;
}
vec4 sampF(vec2 uv){
  if(uv.x<0.||uv.x>1.||uv.y<0.||uv.y>1.) return vec4(0.);
  return texture(uTexF, uv);
}
/* blurred subject sampling (9-tap + wide pass) — fg softens with the bg */
vec4 blurF(vec2 uv){
  vec2 off = vec2(uBlur * .0014) * vec2(1., uRes.x/uRes.y);
  vec3 s = vec3(0.); float a = 0.; vec4 t;
  t = sampF(uv + vec2(-off.x,-off.y)); s += t.rgb*t.a; a += t.a;
  t = sampF(uv + vec2( 0.,   -off.y)); s += t.rgb*t.a; a += t.a;
  t = sampF(uv + vec2( off.x,-off.y)); s += t.rgb*t.a; a += t.a;
  t = sampF(uv + vec2(-off.x, 0.));    s += t.rgb*t.a; a += t.a;
  t = sampF(uv);                       s += t.rgb*t.a; a += t.a;
  t = sampF(uv + vec2( off.x, 0.));    s += t.rgb*t.a; a += t.a;
  t = sampF(uv + vec2(-off.x, off.y)); s += t.rgb*t.a; a += t.a;
  t = sampF(uv + vec2( 0.,    off.y)); s += t.rgb*t.a; a += t.a;
  t = sampF(uv + vec2( off.x, off.y)); s += t.rgb*t.a; a += t.a;
  vec4 r = vec4(s / max(a, 1e-4), a / 9.);
  if(uBlur > 5.){
    vec2 o2 = off * 1.9;
    vec3 s2 = vec3(0.); float a2 = 0.;
    t = sampF(uv + vec2(-o2.x, 0.)); s2 += t.rgb*t.a; a2 += t.a;
    t = sampF(uv + vec2( o2.x, 0.)); s2 += t.rgb*t.a; a2 += t.a;
    t = sampF(uv + vec2(0., -o2.y)); s2 += t.rgb*t.a; a2 += t.a;
    t = sampF(uv + vec2(0.,  o2.y)); s2 += t.rgb*t.a; a2 += t.a;
    vec4 r2 = vec4(s2 / max(a2, 1e-4), a2 / 4.);
    r = mix(r, r2, .38);
  }
  return r;
}
/* cinematic warm grade so even cold stage light reads as color */
vec3 grade(vec3 c){
  c = max(mix(vec3(dot(c, vec3(.2126,.7152,.0722))), c, 2.05), vec3(0.));
  c *= vec3(1.16, .99, .82);
  return pow(max(c, vec3(0.)), vec3(.93, 1.0, 1.10));
}

/* gentler grade for the subject — less crushing, less punch */
vec3 gradeF(vec3 c){
  c = max(mix(vec3(dot(c, vec3(.2126,.7152,.0722))), c, 1.35), vec3(0.));
  c *= vec3(1.08, .99, .90);
  return pow(max(c, vec3(0.)), vec3(.97, 1.0, 1.05));
}

/* soft-edged rounded hexagon SDF — the "geometric logo" origin */
float sdHex(vec2 p, float r){
  const vec3 k = vec3(-0.866025404, 0.5, 0.577350269);
  p = abs(p);
  p -= 2.0*min(dot(k.xy, p), 0.0)*k.xy;
  p -= vec2(clamp(p.x, -k.z*r, k.z*r), r);
  return length(p)*sign(p.y);
}

void main(){
  float aspect = uRes.x / uRes.y;
  float imgAspect = uImgRes.x / uImgRes.y;

  /* ---- image occupies right ~38% of frame, cover-fit, fade to black left ---- */
  float slotW = .42;
  float slotH = 1.0;
  vec2 luv = vec2((vUv.x - (1. - slotW)) / slotW, vUv.y);

  /* parallax offsets: bg drifts against, subject with the pointer (deep → near) */
  vec2 oBg = uMouse * .014 * uDepth;
  vec2 oFg = uMouse * .045 * uDepth;

  float slotAspect = (slotW * aspect) / slotH;
  vec2 base = luv;
  if(imgAspect > slotAspect){
    float s = slotAspect / imgAspect;
    base.x = (luv.x - .5) * s + .5;
  }else{
    float s = imgAspect / slotAspect;
    base.y = (luv.y - .5) * s + .5;
  }
  /* bg overscan for parallax; subject slightly zoomed OUT so it fits the frame fully */
  vec2 cuvB = (base - .5) * .94 + .5 + oBg;   // bg: farther + counter-drift
  vec2 cuvF = (base - .5) * 1.06 + .5 + oFg + vec2(0., -.055);  // subject: smaller + nudged lower

  /* soft fade: full image at right edge → black toward the slot's left edge */
  float ramp = smoothstep(.0, .58, luv.x);
  float outside = smoothstep(-0.06, .02, luv.x);
  float fadeIn  = ramp * outside;

  /* vertical soft edge so image doesn't touch top/bottom borders */
  float vfade = smoothstep(.0,.06,luv.y) * smoothstep(1.,.94,luv.y);
  fadeIn *= vfade;

  /* ---------- layers: bg then subject (9-tap blur when far) ---------- */
  vec3 bgc;
  if(uBlur < .08){
    bgc = sampB(cuvB);
  }else{
    vec2 off = vec2(uBlur * .0016) * vec2(1., uRes.x/uRes.y);
    vec3 s = vec3(0.);
    s += sampB(cuvB + vec2(-off.x,-off.y));
    s += sampB(cuvB + vec2( 0.,   -off.y));
    s += sampB(cuvB + vec2( off.x,-off.y));
    s += sampB(cuvB + vec2(-off.x, 0.));
    s += sampB(cuvB);
    s += sampB(cuvB + vec2( off.x, 0.));
    s += sampB(cuvB + vec2(-off.x, off.y));
    s += sampB(cuvB + vec2( 0.,    off.y));
    s += sampB(cuvB + vec2( off.x, off.y));
    bgc = s / 9.;
    if(uBlur > 5.){
      vec2 o2 = off * 1.9;
      vec3 s2 = vec3(0.);
      s2 += sampB(cuvB + vec2(-o2.x, 0.));
      s2 += sampB(cuvB + vec2( o2.x, 0.));
      s2 += sampB(cuvB + vec2(0., -o2.y));
      s2 += sampB(cuvB + vec2(0.,  o2.y));
      bgc = mix(bgc, s2/4., .38);
    }
  }
  vec4 fgc = uBlur < .08 ? sampF(cuvF) : blurF(cuvF);

  /* ---------- grayscale + contrast per layer (fg softer) ---------- */
  float gB = dot(bgc, vec3(.2126,.7152,.0722));
  vec3 bwB = (vec3(gB) - .5) * uContrast + .5;
  float gF = dot(fgc.rgb, vec3(.2126,.7152,.0722));
  vec3 bwF = (vec3(gF) - .5) * (uContrast * .68) + .5;

  /* ---------- two-layer reveal: BACKGROUND colors first, subject follows ---------- */
  float maskF = fgc.a;                          // exact subject cutout
  vec2 hexC = vec2(.62, .5);
  vec2 pH = (luv - hexC) * vec2(slotW * aspect, 1.0);
  float dHex = sdHex(pH * 2.4, 1.05);

  float front = uReveal * 4.2 - 1.55;           // starts below every pixel → no pop-in
  float mBg = uReveal > 0.001 ? smoothstep(dHex - .60, dHex + .80, front) : 0.;
  float mSub = uReveal > 0.001 ? smoothstep(dHex - .32, dHex + .45, front - .85) : 0.;
  float m = clamp(mix(mBg, mSub, maskF), 0., 1.);

  /* color develops gradually behind the wave — like a print coming up */
  vec3 colB = mix(bwB, grade(bgc), mBg * (.30 + .70 * uReveal));
  vec3 colF = mix(bwF, gradeF(fgc.rgb), mSub * (.30 + .70 * uReveal));

  /* composite subject over background with soft edges */
  vec3 finalCol = mix(colB, colF, maskF);

  /* soft traveling glow — two rings hugging the wavefronts, fade in slowly */
  if(uReveal > 0.001){
    float fade = smoothstep(0., .14, uReveal);
    float ringB = 1. - smoothstep(0., .38, abs(front - dHex));
    float ringS = 1. - smoothstep(0., .30, abs((front - .85) - dHex));
    finalCol += vec3(1., .40, .10) * ringB * (1.-maskF) * .16 * fade;
    finalCol += vec3(1., .50, .14) * ringS * maskF * .18 * fade;
  }

  /* ---------- micro dust: tiny bright motes drifting in the slot only ---------- */
  float dust = 0.;
  {
    float sc = 110.;
    vec2 g1 = luv * vec2(sc * slotW * aspect, sc);
    vec2 cell = floor(g1);
    vec2 f = fract(g1);
    float h = hash(cell);
    if(h > .965){
      vec2 pos = vec2(fract(h * 93.7), fract(h * 57.3));
      pos.x += sin(uTime * .22 + h * 41.0) * .25;
      pos.y += uTime * .012;
      float d = length(f - fract(pos));
      float tw = .55 + .45 * sin(uTime * (1.1 + h * 2.4) + h * 90.);
      dust += smoothstep(.20, .0, d) * tw;
    }
    float sc2 = 200.;
    vec2 g2 = luv * vec2(sc2 * slotW * aspect, sc2) + 7.31;
    vec2 cell2 = floor(g2);
    vec2 f2 = fract(g2);
    float h2 = hash(cell2);
    if(h2 > .978){
      vec2 pos = vec2(fract(h2 * 71.3), fract(h2 * 23.1));
      pos.y += uTime * .02;
      float d = length(f2 - fract(pos));
      float tw = .5 + .5 * sin(uTime * (2.0 + h2 * 3.0) + h2 * 130.);
      dust += smoothstep(.16, .0, d) * tw;
    }
  }
  float dustZone = fadeIn * smoothstep(.0, .18, luv.x);
  dustZone *= .45 + .55 * uReveal;              // more life once color arrives
  finalCol += vec3(1., .72, .38) * dust * dustZone * .8;

  /* warm bleed rising over the black side as reveal completes */
  float bleed = smoothstep(.36, .0, luv.x) * uReveal * uReveal;
  bleed *= vfade;
  finalCol += vec3(.55,.18,.04) * bleed * .30;

  /* ---------- text zone (appears on black left side, phase 3) ---------- */
  // text is drawn as DOM; here we only keep left side pure black for it
  // add faint grid noise on black area so it isn't dead-flat
  float grid = step(.5, fract(luv.x*24.) )*step(.5, fract(luv.y*14.));
  finalCol += vec3(.012) * (1.-fadeIn) * grid;

  /* ---------- grain ---------- */
  float gr = hash(vUv*vec2(1440.,810.) + uTime*.7) * .055 - .0275;
  finalCol += gr * mix(1.2, .7, m);

  /* multiply by image mask so left is truly black; but keep glow over black in phase3 */
  finalCol *= max(fadeIn, m * .95);

  /* ---------- vignette ---------- */
  vec2 q = vUv*2.-1.;
  finalCol *= 1. - dot(q,q)*.14;
  finalCol *= mix(.85, 1., smoothstep(1.35,.25,length(q)));

  outColor = vec4(clamp(finalCol,0.,1.), 1.);
}`;

/* ---------- program ---------- */
function sh(type, src){
  var s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    console.error('shader:', gl.getShaderInfoLog(s));
  return s;
}
var prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog, gl.LINK_STATUS))
  console.error('link:', gl.getProgramInfoLog(prog));
gl.useProgram(prog);

var buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
var loc = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

var U = {};
['uTexB','uTexF','uMouse','uDepth','uRes','uImgRes','uBlur','uContrast','uReveal','uTextIn','uTime']
  .forEach(function(n){ U[n] = gl.getUniformLocation(prog, n); });

/* ---------- textures: bg plate + subject plate ---------- */
var imgReady = false, imgW = 1920, imgH = 1280;
var TEX_MAX = 1280;   // decode cap: big enough for the slot, kind to VRAM

function makeTex(){
  var t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));
  return t;
}

/* decode via an offscreen 2D canvas:
   - GPU-safe upload path (avoids the image-decode race we hit headless)
   - no NPOT mipmap rules (we blur in-shader anyway)
   - downscale caps VRAM */
function loadTex(t, image){
  var w = image.naturalWidth, h = image.naturalHeight;
  var scale = Math.min(1, TEX_MAX / Math.max(w, h));
  var cv = document.createElement('canvas');
  cv.width  = Math.max(2, Math.round(w * scale));
  cv.height = Math.max(2, Math.round(h * scale));
  cv.getContext('2d').drawImage(image, 0, 0, cv.width, cv.height);
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
}

var texB = makeTex();
var texF = makeTex();

var bgImg = new Image();
bgImg.src = 'assets/dual/background.webp';
bgImg.onload = function(){
  imgW = bgImg.naturalWidth; imgH = bgImg.naturalHeight;
  loadTex(texB, bgImg);
  imgReady = true;
  if(enterBtn) enterBtn.classList.add('ready');
};
var fgImg = new Image();
fgImg.src = 'assets/dual/foreground.webp';
fgImg.onload = function(){
  loadTex(texF, fgImg);
};

/* ---------- mouse parallax (smoothed) ---------- */
var mouse = {x:0, y:0, tx:0, ty:0, depth:0, tdepth:0};
window.addEventListener('mousemove', function(e){
  mouse.tx = (e.clientX / window.innerWidth  - .5) * 2;
  mouse.ty = (e.clientY / window.innerHeight - .5) * 2;
  mouse.tdepth = 1;
}, {passive:true});
window.addEventListener('mouseout', function(e){
  if(!e.relatedTarget){ mouse.tdepth = 0; }
});

/* ---------- resize ---------- */
var W = 0, H = 0;
function resize(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

/* ---------- journey driver (button, not scroll) ---------- */
var state = {p:0, blur:15, contrast:.75, reveal:0, textIn:0, phase:1};
var target = {p:0};
var journey = {playing:false, t0:0, dur:3500};
var enterBtn = document.getElementById('enterbtn');
function startJourney(){
  if(journey.playing || state.p > .001) return;   // already running / done
  journey.playing = true;
  journey.t0 = performance.now();
  enterBtn.classList.add('gone');
}
if(enterBtn) enterBtn.addEventListener('click', startJourney);
/* timeline pump: drives the journey even when rAF throttles (bg tab) */
setInterval(function(){
  if(!journey.playing) return;
  var jp = Math.min(1, (performance.now() - journey.t0) / journey.dur);
  target.p = jp;
  if(jp >= 1) journey.playing = false;
}, 120);

/* ---------- HUD refs ---------- */
var elPct = document.getElementById('pct');
var mb1 = document.getElementById('mb1'), mb2 = document.getElementById('mb2'), mb3 = document.getElementById('mb3');
var ph = [document.getElementById('ph1'), document.getElementById('ph2'), document.getElementById('ph3')];

/* ---------- state hook for verification/debug ---------- */
window.__reveal = { getState: function(){ return {
  p: +state.p.toFixed(3), targetP: +target.p.toFixed(3), blur: +state.blur.toFixed(2),
  contrast: +state.contrast.toFixed(2), reveal: +state.reveal.toFixed(3),
  textIn: +state.textIn.toFixed(3), phase: state.phase, imgReady: imgReady
}; } };
window.__reveal.start = startJourney;

/* ---------- render loop ---------- */
var t0 = performance.now(), last = t0, raf;
var hudLast = 0;
function tick(now){
  raf = requestAnimationFrame(tick);
  if(document.hidden) return;

  // button-driven journey: advance target along the 0→100 timeline
  if(journey.playing){
    var jp = Math.min(1, (now - journey.t0) / journey.dur);
    target.p = jp;
    if(jp >= 1) journey.playing = false;
  }

  // critically-damped-ish easing
  state.p += (target.p - state.p) * .09;
  if(Math.abs(target.p - state.p) < .0004) state.p = target.p;

  var p = state.p;
  var blur, contrast, reveal, textIn, phase;

  if(p < .38){                       // phase 1: blur + B&W
    var t1 = p / .38;
    blur = 15 - 13 * t1;             // 15 → 2
    contrast = .75;
    reveal = 0; textIn = 0; phase = 1;
  }else if(p < .55){                 // phase 2: focus, still B&W
    var t2 = (p - .38) / .17;
    var e2 = t2*t2*(3-2*t2);
    blur = 2 * (1 - e2);             // 2 → 0
    contrast = .75 + .35 * e2;       // .75 → 1.10
    reveal = 0; textIn = 0; phase = 2;
  }else{                             // phase 3: color from hexagon — long, gentle
    var t3 = (p - .55) / .45;
    var e3 = t3*t3*t3*(t3*(t3*6-15)+10);   // smootherstep: gentle start & landing
    blur = 0;
    contrast = 1.10;
    reveal = e3;
    textIn = Math.min(1, Math.max(0, e3 - .10) * 1.55);
    phase = 3;
  }
  state.blur = blur; state.contrast = contrast;
  state.reveal = reveal; state.textIn = textIn; state.phase = phase;

  // mouse smoothing (slow cinematic lag)
  mouse.x += (mouse.tx - mouse.x) * .06;
  mouse.y += (mouse.ty - mouse.y) * .06;
  mouse.depth += (mouse.tdepth - mouse.depth) * .04;

  // draw
  gl.useProgram(prog);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texB);
  gl.uniform1i(U.uTexB, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, texF);
  gl.uniform1i(U.uTexF, 1);
  gl.uniform2f(U.uMouse, mouse.x, mouse.y);
  gl.uniform1f(U.uDepth, mouse.depth);
  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform2f(U.uImgRes, imgW, imgH);
  gl.uniform1f(U.uBlur, blur);
  gl.uniform1f(U.uContrast, contrast);
  gl.uniform1f(U.uReveal, reveal);
  gl.uniform1f(U.uTextIn, textIn);
  gl.uniform1f(U.uTime, (now - t0) * .001);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  // DOM text overlay opacity (phase 3)
  var txt = document.getElementById('headline');
  if(txt) txt.style.opacity = (textIn * .96).toFixed(3);
  var sub = document.getElementById('subline');
  if(sub) sub.style.opacity = (Math.max(0, textIn - .25) / .75).toFixed(3);

  // HUD (throttled)
  if(now - hudLast > 66){
    hudLast = now;
    elPct.textContent = Math.round(p * 100);
    mb1.style.width = Math.min(1, blur / 15) * 100 + '%';
    mb2.style.width = (phase >= 2 ? (1 - blur / 2) : 0) * 100 + '%';
    mb3.style.width = reveal * 100 + '%';
    ph.forEach(function(el, i){ el.classList.toggle('active', phase === i + 1); });
  }
}
raf = requestAnimationFrame(tick);

/* ---------- sync force-render (verification/debug) ---------- */
window.__reveal.force = function(pv){
  state.p = pv; target.p = pv;
  var p = state.p, blur, contrast, reveal, textIn, phase;
  if(p < .38){
    var t1 = p / .38; blur = 15 - 13 * t1; contrast = .75; reveal = 0; textIn = 0; phase = 1;
  }else if(p < .55){
    var t2 = (p - .38) / .17; var e2 = t2*t2*(3-2*t2);
    blur = 2 * (1 - e2); contrast = .75 + .35 * e2; reveal = 0; textIn = 0; phase = 2;
  }else{
    var t3 = (p - .55) / .45; var e3 = t3*t3*t3*(t3*(t3*6-15)+10);
    blur = 0; contrast = 1.10; reveal = e3;
    textIn = Math.min(1, Math.max(0, e3 - .10) * 1.55); phase = 3;
  }
  state.blur = blur; state.contrast = contrast;
  state.reveal = reveal; state.textIn = textIn; state.phase = phase;
  gl.useProgram(prog);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texB);
  gl.uniform1i(U.uTexB, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, texF);
  gl.uniform1i(U.uTexF, 1);
  gl.uniform2f(U.uMouse, 0.35, -0.25);
  gl.uniform1f(U.uDepth, 1.0);
  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform2f(U.uImgRes, imgW, imgH);
  gl.uniform1f(U.uBlur, blur);
  gl.uniform1f(U.uContrast, contrast);
  gl.uniform1f(U.uReveal, reveal);
  gl.uniform1f(U.uTextIn, textIn);
  gl.uniform1f(U.uTime, 4.2);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  var txt = document.getElementById('headline');
  if(txt) txt.style.opacity = (textIn * .96).toFixed(3);
  var sub = document.getElementById('subline');
  if(sub) sub.style.opacity = (Math.max(0, textIn - .25) / .75).toFixed(3);
};
var overlay = document.createElement('div');
overlay.style.cssText = 'position:absolute;left:0;top:0;bottom:0;width:57vw;z-index:4;pointer-events:none;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding:0 3.2vw;text-align:right;';
overlay.innerHTML =
  '<h1 id="headline" style="opacity:0;transition:opacity .12s linear;font-family:\'Lalezar\',Vazirmatn,sans-serif;font-size:clamp(44px,7vw,92px);font-weight:400;line-height:1.15;margin:0">' +
    'سینا <span style="color:#ff5a1f">گل‌نقره</span>' +
  '</h1>';
document.getElementById('stage').appendChild(overlay);

/* expose cleanup (unused but tidy) */
window.__reveal.destroy = function(){ cancelAnimationFrame(raf); };
})();
</script>
</body>
</html>
